name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check entrypoints
        run: |
          python -m py_compile streamlit_app.py src/ammo_mc/streamlit_app.py src/ammo_mc/cuas_mission.py src/ammo_mc/cuas_analytics.py src/ammo_mc/vis_cuas_mission.py src/ammo_mc/vis_cuas_analytics.py src/ammo_mc/api.py src/ammo_mc/cli.py src/ammo_mc/ui/*.py

      - name: Run pytest suite
        run: pytest
