name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check entrypoints
        run: |
          python -m py_compile streamlit_app.py src/ammo_mc/streamlit_app.py src/ammo_mc/cuas_mission.py src/ammo_mc/cuas_analytics.py src/ammo_mc/cuas_raid.py src/ammo_mc/terrain_dem.py src/ammo_mc/calibration.py src/ammo_mc/literature.py src/ammo_mc/scenario_library.py src/ammo_mc/briefing_export.py src/ammo_mc/vis_cuas_mission.py src/ammo_mc/vis_cuas_analytics.py src/ammo_mc/vis_cuas_raid.py src/ammo_mc/vis_calibration.py src/ammo_mc/small_arms.py src/ammo_mc/vis_3d.py src/ammo_mc/api.py src/ammo_mc/cli.py src/ammo_mc/ui/*.py src/ammo_mc/small_arms_pkg/*.py src/ammo_mc/vis_3d_pkg/*.py

      - name: Run pytest suite
        run: pytest
