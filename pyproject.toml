[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ammo-mc"
version = "1.3.0"
description = "Stochastic Ammunition Effects & Dispersion Monte Carlo Simulator (launch -> flight -> fuze -> terminal -> vulnerability -> hazard statistics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.24",
    "fastapi>=0.109",
    "uvicorn>=0.54.0",
    "typer>=0.9",
    "streamlit>=1.50",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
accel = ["numba>=0.59"]
dev = ["pytest>=8.0", "httpx>=0.26"]

[project.scripts]
ammo-mc = "ammo_mc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ammo_mc = ["data_tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
